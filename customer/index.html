<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Society Savings</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f4;font-family:Arial,sans-serif;color:#172b35}
header{background:#063044;color:white;padding:28px 22px;border-radius:0 0 25px 25px}
header h1{margin:0 0 8px}
header p{margin:0;color:#c7d8df}
.card{background:white;margin:25px 16px;padding:25px;border-radius:20px;box-shadow:0 5px 25px #0000000b}
h2{margin-top:0}
input{width:100%;padding:16px;margin:9px 0 17px;border:1px solid #d9e1e2;border-radius:12px;font-size:16px}
button{width:100%;padding:16px;background:#087c65;color:white;border:0;border-radius:12px;font-size:16px;font-weight:bold;margin:7px 0}
.secondary{background:#e5f2ee;color:#087c65}
#message{margin-top:15px;line-height:1.5}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>Society Savings</h1>
<p>Your society account portal</p>
</header>

<div class="card" id="authCard">
<h2 id="heading">Member Login</h2>
<p id="description">Sign in using your registered mobile number.</p>

<div id="registerFields" class="hidden">
<label>Full name</label>
<input id="name" type="text" placeholder="Enter full name">
</div>

<label>Mobile number</label>
<input id="mobile" type="tel" maxlength="10" placeholder="10-digit mobile number">

<label>Password</label>
<input id="password" type="password" placeholder="Password">

<button id="submitBtn" onclick="submitForm()">Sign In</button>
<button class="secondary" id="switchBtn" onclick="toggleMode()">Create Account</button>
<p id="message"></p>
</div>

<div class="card hidden" id="dashboard">
<h2>Welcome</h2>
<p id="welcome"></p>
<p>Your account registration/login is connected.</p>
<p>Other banking features will be enabled after their backend is completed.</p>
<button onclick="logout()">Sign Out</button>
</div>

<script>
const SUPABASE_URL = "https://mmgvfxqqnzqokeuojadp.supabase.co";
const SUPABASE_KEY = "sb_publishable_bm16oFdCJ4oCyR4u8EaXJA_8GK4qXc8";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const FUNCTION_URL = SUPABASE_URL + "/functions/v1/customer-register";

let registering = false;

function toggleMode(){
 registering = !registering;
 document.getElementById("registerFields").classList.toggle("hidden",!registering);
 document.getElementById("heading").textContent = registering ? "Create Account" : "Member Login";
 document.getElementById("description").textContent = registering ? "Register your Society Savings account." : "Sign in using your registered mobile number.";
 document.getElementById("submitBtn").textContent = registering ? "Register Account" : "Sign In";
 document.getElementById("switchBtn").textContent = registering ? "Back to Login" : "Create Account";
 document.getElementById("message").textContent = "";
}

async function submitForm(){
 const msg = document.getElementById("message");
 const mobile = document.getElementById("mobile").value.trim();
 const password = document.getElementById("password").value;
 const full_name = document.getElementById("name").value.trim();

 if(!/^[0-9]{10}$/.test(mobile)){
  msg.textContent = "Enter a valid 10-digit mobile number.";
  return;
 }
 if(password.length < 10){
  msg.textContent = "Password must contain at least 10 characters.";
  return;
 }

 document.getElementById("submitBtn").disabled = true;
 msg.textContent = "Please wait...";

 try{
  const email = mobile + "@customers.societysavings.invalid";

  if(registering){
   if(!full_name){
    msg.textContent = "Enter your full name.";
    return;
   }

   const response = await fetch(FUNCTION_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},
    body:JSON.stringify({full_name,mobile,password})
   });

   const result = await response.json();
   if(!response.ok || !result.success){
    throw new Error(result.error || result.message || "Registration failed.");
   }

   msg.textContent = "Registration successful. You can now sign in.";
   toggleMode();
   msg.textContent = "Registration successful. Please sign in.";
  }else{
   const {data,error} = await db.auth.signInWithPassword({email,password});
   if(error) throw error;
   showDashboard(data.user);
  }
 }catch(error){
  msg.textContent = error.message || "Something went wrong.";
 }finally{
  document.getElementById("submitBtn").disabled = false;
 }
}

function showDashboard(user){
 document.getElementById("authCard").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 document.getElementById("welcome").textContent = "You are signed in.";
}

async function logout(){
 await db.auth.signOut();
 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("authCard").classList.remove("hidden");
}

db.auth.getSession().then(({data})=>{
 if(data.session) showDashboard(data.session.user);
});
</script>
</body>
</html>
